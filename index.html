<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Generator</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main
      class="min-vh-100 d-flex align-items-center justify-content-center py-4"
    >
      <div class="container px-3">
        <div class="password-card mx-auto">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="security-icon mb-3">🔐</div>

            <h1 class="fw-bold mb-2">Password Generator</h1>

            <p class="text-secondary mb-0">
              Create a strong and secure password in seconds.
            </p>
          </div>

          <!-- Password Output -->
          <div class="password-output mb-4">
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                id="passBox"
                placeholder="Your password will appear here"
                readonly
              />

              <button
                class="btn btn-light copy-btn"
                type="button"
                id="copyIcon"
                title="Copy password"
              >
                📋
              </button>
            </div>
          </div>

          <!-- Password Length -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label for="inputSlider" class="form-label fw-semibold mb-0">
                Password Length
              </label>

              <span id="sliderValue" class="length-badge"> 8 </span>
            </div>

            <input
              type="range"
              class="form-range"
              min="1"
              max="30"
              value="8"
              id="inputSlider"
            />

            <div class="d-flex justify-content-between small text-secondary">
              <span>1</span>
              <span>30</span>
            </div>
          </div>

          <!-- Options -->
          <div class="options-section mb-4">
            <h5 class="fw-bold mb-3">Password Options</h5>

            <!-- Lowercase -->
            <div class="option-row">
              <div>
                <label for="lowercase" class="fw-semibold">
                  Lowercase Letters
                </label>

                <small class="d-block text-secondary"> a-z </small>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="lowercase"
                  checked
                />
              </div>
            </div>

            <!-- Uppercase -->
            <div class="option-row">
              <div>
                <label for="uppercase" class="fw-semibold">
                  Uppercase Letters
                </label>

                <small class="d-block text-secondary"> A-Z </small>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="uppercase"
                  checked
                />
              </div>
            </div>

            <!-- Numbers -->
            <div class="option-row">
              <div>
                <label for="numbers" class="fw-semibold"> Numbers </label>

                <small class="d-block text-secondary"> 0-9 </small>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="numbers"
                  checked
                />
              </div>
            </div>

            <!-- Symbols -->
            <div class="option-row">
              <div>
                <label for="symbols" class="fw-semibold">
                  Special Characters
                </label>

                <small class="d-block text-secondary"> @ # $ % & </small>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="symbols"
                  checked
                />
              </div>
            </div>
          </div>

          <!-- Generate Button -->
          <button
            type="button"
            class="btn btn-primary w-100 generate-btn"
            id="genBtn"
          >
            🔑 Generate Password
          </button>

          <!-- Footer -->
          <p class="text-center text-secondary small mt-3 mb-0">
            Generate unique passwords for better account security.
          </p>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
